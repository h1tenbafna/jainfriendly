[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jainfriendly"
version = "0.1.0"
description = "Ingredient tagging and Jain / vegetarian / vegan / allergen checks for packaged food"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["jainfriendly"]

[tool.setuptools.package-data]
jainfriendly = ["data/*.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
