  # --- Allergen sources ---
  wheat:          {label: Wheat (gluten), groups: [allergen_gluten]}
  barley:         {label: Barley / malt (gluten), groups: [allergen_gluten]}
  rye:            {label: Rye (gluten), groups: [allergen_gluten]}
  oats:           {label: Oats, groups: [allergen_gluten]}
  peanut:         {label: Peanut, groups: [allergen_peanut]}
  tree_nut:       {label: Tree nuts, groups: [allergen_tree_nut]}
  soy:            {label: Soy, groups: [allergen_soy]}
  sesame:         {label: Sesame, groups: [allergen_sesame]}
  mustard:        {label: Mustard, groups: [allergen_mustard]}
  celery:         {label: Celery, groups: [allergen_celery]}
  lupin:          {label: Lupin, groups: [allergen_lupin]}
  sulphite:       {label: Sulphites, groups: [allergen_sulphite]}

  # --- Label-level declarations ---
  non_veg_mark:   {label: FSSAI non-vegetarian (brown) mark, groups: [non_veg_declared]}
