# Ingredient lexicon: maps phrases found on labels to tags.
#
#   match:    phrases (any case/plural/spelling variant; text is normalised before matching,
#             so "Onions", "ONION" and "onion" are the same, and flavor == flavour,
#             sulfite == sulphite, iodized == iodised, chili == chilli, gelatine == gelatin).
#   tags:     tags that are definitely present when the phrase appears.
#   possible: tags that MAY be present (hidden / unspecified source), each with a likelihood
#             (high | medium | low). `reason` explains why, and is shown to users.
#   An entry with neither tags nor possible is a *known, harmless* ingredient: it is listed
#   so we can say "we recognised every ingredient" rather than silently skipping it.
#
# Matching is longest-phrase-first, so "sweet potato" wins over "potato",
# "coconut milk" over "milk", and "peanut butter" over "butter".
#
# When a generic term (e.g. "seasoning") is followed by a bracketed breakdown on the label,
# the breakdown is trusted and the term's `possible` list is not applied.

