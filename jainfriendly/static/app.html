<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JainFriendly</title>
<style>
  :root {
    --bg: #faf8f4; --card: #ffffff; --ink: #1d1b18; --muted: #6b665e; --line: #e6e1d8; --soft: #f2eee7;
    --ok: #1f7a4d; --ok-bg: #e5f4ec; --likely: #3a7d2c; --likely-bg: #eef6e8;
    --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #a12a2a; --bad-bg: #fbe7e7; --nodata: #77726a; --nodata-bg: #eeebe6;
    --accent: #c2541b; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --card: #201f1c; --ink: #eeeae3; --muted: #a39d93; --line: #35322d; --soft: #2a2825;
      --ok: #6fd3a0; --ok-bg: #173527; --likely: #9ad57f; --likely-bg: #1f3318;
      --warn: #f0c060; --warn-bg: #3a2e12; --bad: #f08a8a; --bad-bg: #3c1c1c; --nodata: #a39d93; --nodata-bg: #2a2825;
      --accent: #f08a4b; --accent-ink: #1d1b18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; gap: 12px; align-items: center; padding: 12px 0 8px; }
  .logo { font-weight: 800; font-size: 1.2rem; white-space: nowrap; }
  .logo span { color: var(--accent); }
  input[type=search] { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
                       background: var(--card); color: var(--ink); font: inherit; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .pill { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  .pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  select.pill { appearance: none; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 10px; color: var(--muted); flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer;
          display: flex; flex-direction: column; transition: transform .1s; }
  .card:hover { transform: translateY(-2px); }
  .thumb { aspect-ratio: 4/3; background: var(--soft); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .thumb .ph { font-size: 2.2rem; opacity: .4; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .brand { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
  .name { font-weight: 600; line-height: 1.25; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .b { font-size: .75rem; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
  .friendly { background: var(--ok-bg); color: var(--ok); }
  .likely_friendly { background: var(--likely-bg); color: var(--likely); }
  .unclear { background: var(--warn-bg); color: var(--warn); }
  .not_friendly { background: var(--bad-bg); color: var(--bad); }
  .no_data { background: var(--nodata-bg); color: var(--nodata); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .t { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .t.hit { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .t.maybe { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .shops { margin-top: auto; font-size: .8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .shop { background: var(--soft); border-radius: 6px; padding: 2px 6px; color: var(--ink); }
  .more { display: block; margin: 20px auto; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 11;
            transform: translateX(100%); transition: transform .2s; overflow-y: auto; border-left: 1px solid var(--line); }
  .open .scrim { display: block; } .open .drawer { transform: none; }
  .dhead { display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .dhead img { width: 96px; height: 96px; object-fit: contain; background: #fff; border-radius: 10px; flex: none; }
  .x { margin-left: auto; background: none; border: 0; font-size: 1.5rem; color: var(--muted); cursor: pointer; line-height: 1; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0 0 8px; font-size: .95rem; }
  .vgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .v { border-radius: 10px; padding: 8px 10px; font-size: .85rem; }
  .v b { display: block; font-size: .9rem; }
  .ev { font-size: .8rem; color: var(--muted); margin: 2px 0 8px; }
  .muted { color: var(--muted); font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .ing { font-size: .85rem; white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 24px 16px 40px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } .vgrid { grid-template-columns: 1fr; } .logo small { display: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">Jain<span>Friendly</span></div>
      <input type="search" id="q" placeholder="Search chips, biscuits, brands…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main class="wrap">
  <div class="bar"><span id="count">Loading…</span><span id="hint" class="muted"></span></div>
  <div class="grid" id="grid"></div>
  <button class="pill more" id="more" hidden>Load more</button>
</main>
<footer id="foot"></footer>

<div id="dlg"><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Product details"></aside></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIETS = [["jain","Jain"],["jain_strict","Jain (strict)"],["vegetarian","Vegetarian"],["vegan","Vegan"]];
const ALLERGENS = [["milk","Milk"],["peanut","Peanut"],["gluten","Gluten"],["tree_nut","Tree nuts"],["soy","Soy"],["egg","Egg"],["sesame","Sesame"],["mustard","Mustard"],["sulphite","Sulphites"]];
const AVOID = [["onion","Onion"],["garlic","Garlic"],["potato","Potato"],["carrot","Carrot"],["beetroot","Beetroot"],["yeast","Yeast"],["mushroom","Mushroom"],["honey","Honey"],["gelatin","Gelatin"]];
const VLABEL = { friendly: "✓ friendly", likely_friendly: "likely ok", unclear: "unclear", not_friendly: "✗ not", no_data: "no data" };

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const state = Object.assign({ diet: ["jain"], free_from: [], avoid: [], platform: "", category: "", strict: false }, load("jf.filters", {}));
state.q = ""; state.offset = 0;
let facets = { categories: [], platforms: [] }, platforms = [];

function pill(label, on, onclick) {
  const b = document.createElement("button");
  b.className = "pill" + (on ? " on" : ""); b.textContent = label; b.onclick = onclick; return b;
}
function select(label, options, value, onchange) {
  const s = document.createElement("select"); s.className = "pill" + (value ? " on" : "");
  s.innerHTML = `<option value="">${esc(label)}</option>` + options.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? "selected" : ""}>${esc(l)}</option>`).join("");
  s.onchange = () => onchange(s.value); return s;
}
function toggle(list, v) { const i = list.indexOf(v); i < 0 ? list.push(v) : list.splice(i, 1); }

function renderFilters() {
  const f = $("#filters"); f.innerHTML = "";
  for (const [id, l] of DIETS) f.append(pill(l, state.diet.includes(id), () => { toggle(state.diet, id); refresh(); }));
  f.append(Object.assign(document.createElement("span"), { className: "sep" }));
  f.append(select("Free from…", ALLERGENS.map(([v, l]) => [v, (state.free_from.includes(v) ? "✓ " : "") + l]), "", (v) => { if (v) toggle(state.free_from, v); refresh(); }));
  for (const a of state.free_from) f.append(pill(`No ${ALLERGENS.find(x => x[0] === a)?.[1] || a} ✕`, true, () => { toggle(state.free_from, a); refresh(); }));
  f.append(select("Avoid ingredient…", AVOID.map(([v, l]) => [v, (state.avoid.includes(v) ? "✓ " : "") + l]), "", (v) => { if (v) toggle(state.avoid, v); refresh(); }));
  for (const a of state.avoid) f.append(pill(`No ${AVOID.find(x => x[0] === a)?.[1] || a} ✕`, true, () => { toggle(state.avoid, a); refresh(); }));
  f.append(Object.assign(document.createElement("span"), { className: "sep" }));
  f.append(select("All stores", platforms.map(p => [p.id, p.name]), state.platform, (v) => { state.platform = v; refresh(); }));
  f.append(select("All categories", facets.categories.map(c => [c.name, `${c.name} (${c.count})`]), state.category, (v) => { state.category = v; refresh(); }));
  f.append(pill("Only verified", state.strict, () => { state.strict = !state.strict; refresh(); }));
}

function params() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  state.diet.forEach(d => p.append("diet", d));
  state.free_from.forEach(d => p.append("free_from", d));
  state.avoid.forEach(d => p.append("avoid", d));
  if (state.platform) p.set("platform", state.platform);
  if (state.category) p.set("category", state.category);
  if (state.strict) p.set("strict", "true");
  p.set("limit", 40); p.set("offset", state.offset);
  return p;
}

function card(p) {
  const avoidIds = new Set(state.avoid);
  const badges = (state.diet.length ? state.diet : ["jain", "vegan"]).map(d => {
    const v = p.verdicts[d] || "no_data";
    return `<span class="b ${v}">${esc(DIETS.find(x => x[0] === d)?.[1] || d)}: ${VLABEL[v]}</span>`;
  }).join("");
  const tags = [
    ...p.contains.slice(0, 8).map(t => `<span class="t ${avoidIds.has(t.id) ? "hit" : ""}">${esc(t.label)}</span>`),
    ...p.may_contain.filter(t => t.likelihood !== "low").slice(0, 3).map(t => `<span class="t maybe">${esc(t.label)}?</span>`),
  ].join("");
  const shops = p.offers.length
    ? p.offers.map(o => `<span class="shop">${esc(o.platform_name)}${o.price != null ? " ₹" + o.price : ""}</span>`).join("")
    : `<span>Store links coming soon</span>`;
  const img = p.image_url ? `<img loading="lazy" src="${esc(p.image_url)}" alt="">` : `<span class="ph">🛒</span>`;
  return `<article class="card" data-id="${p.id}">
    <div class="thumb">${img}</div>
    <div class="body">
      <div class="brand">${esc(p.brand || "")}${p.quantity ? " · " + esc(p.quantity) : ""}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="badges">${badges}</div>
      ${p.has_ingredients ? `<div class="tags">${tags || '<span class="t">no flagged ingredients</span>'}</div>` : `<div class="muted">Ingredients not available yet</div>`}
      <div class="shops">${shops}</div>
    </div></article>`;
}

async function fetchPage(append) {
  const res = await fetch("/v1/products?" + params());
  const d = await res.json();
  if (!res.ok) { $("#count").textContent = d.detail || "Error"; return; }
  const html = d.items.map(card).join("");
  if (append) $("#grid").insertAdjacentHTML("beforeend", html); else $("#grid").innerHTML = html;
  const shown = state.offset + d.items.length;
  const desc = [...state.diet.map(x => DIETS.find(y => y[0] === x)?.[1]), ...state.free_from.map(a => "no " + a), ...state.avoid.map(a => "no " + a)].filter(Boolean).join(", ");
  $("#count").textContent = `${d.total.toLocaleString()} products${desc ? " · " + desc : ""}`;
  $("#hint").textContent = state.diet.length && !state.strict ? "Includes 'likely ok' — tap Only verified for strict results" : "";
  $("#more").hidden = shown >= d.total;
  if (!d.total) $("#grid").innerHTML = `<div class="empty">No products match these filters yet.</div>`;
  $("#foot").textContent = d.attribution;
}

function refresh() { save("jf.filters", { diet: state.diet, free_from: state.free_from, avoid: state.avoid, platform: state.platform, category: state.category, strict: state.strict }); state.offset = 0; renderFilters(); fetchPage(false); }
$("#more").onclick = () => { state.offset += 40; fetchPage(true); };
let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); state.offset = 0; fetchPage(false); }, 250); };

// ---------------------------------------------------------------- detail drawer
$("#grid").onclick = (e) => { const c = e.target.closest(".card"); if (c) openProduct(c.dataset.id); };
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
function closeDrawer() { $("#dlg").classList.remove("open"); }

async function openProduct(id) {
  const p = await (await fetch(`/v1/products/${id}`)).json();
  const a = p.analysis;
  const vblock = a ? ["jain", "jain_strict", "vegetarian", "vegan"].map(k => {
    const r = a.profiles[k];
    const why = [...r.violations.map(v => v.label), ...r.uncertain.map(u => u.label + "?")].slice(0, 4).join(", ");
    return `<div class="v ${r.verdict}"><b>${esc(r.headline)}</b>${esc(why)}</div>`;
  }).join("") : "";
  const allergens = a ? Object.entries(a.profiles).filter(([k, r]) => k.startsWith("allergen:") && r.verdict !== "friendly" && r.verdict !== "likely_friendly")
      .map(([k, r]) => `<span class="b ${r.verdict}">${esc(r.headline)}</span>`).join(" ") : "";
  const tagList = (status) => a ? a.tags.filter(t => t.status === status).map(t =>
    `<div><span class="t ${status === "present" ? "" : "maybe"}">${esc(t.label)}${t.likelihood ? " (" + t.likelihood + ")" : ""}</span>
     <div class="ev">${esc([...new Set(t.evidence.map(e => e.ingredient + (e.reason ? " — " + e.reason : "")))].join(" · "))}</div></div>`).join("") : "";
  const offers = p.offers.length ? `<table>${p.offers.map(o => `<tr><td>${esc(o.platform_name)}${o.location ? ` <span class="muted">(${esc(o.location)})</span>` : ""}</td>
      <td>${o.price != null ? "₹" + o.price : ""}${o.mrp && o.mrp !== o.price ? ` <s class="muted">₹${o.mrp}</s>` : ""}</td>
      <td>${o.in_stock === false ? '<span class="muted">out of stock</span>' : ""}</td>
      <td>${o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">Open ↗</a>` : ""}</td></tr>`).join("")}</table>`
    : `<p class="muted">We haven't linked this product to stores yet.</p>`;
  const unrec = a && a.unrecognized.length ? `<p class="muted">Not yet in our database: ${esc(a.unrecognized.join("; "))}</p>` : "";
  $("#drawer").innerHTML = `
    <div class="dhead">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : ""}
      <div><div class="brand">${esc(p.brand || "")}${p.quantity ? " · " + esc(p.quantity) : ""}</div><h2 style="margin:2px 0 4px;font-size:1.15rem">${esc(p.name)}</h2>
      <div class="muted">${p.gtin ? "Barcode " + esc(p.gtin) : ""}${p.category ? " · " + esc(p.category) : ""}</div></div>
      <button class="x" aria-label="Close">×</button></div>
    ${a ? `<div class="sec"><h3>Diet check</h3><div class="vgrid">${vblock}</div>${allergens ? `<p>${allergens}</p>` : ""}</div>
    <div class="sec"><h3>Contains</h3>${tagList("present") || '<p class="muted">Nothing on our watch-list.</p>'}
      ${tagList("possible") ? `<h3 style="margin-top:12px">Might contain (hidden in generic ingredients)</h3>${tagList("possible")}` : ""}
      ${tagList("trace") ? `<h3 style="margin-top:12px">May contain traces</h3>${tagList("trace")}` : ""}${unrec}</div>`
      : `<div class="sec"><p>We don't have this product's ingredient list yet.</p>${p.source.url ? `<p><a href="${esc(p.source.url)}" target="_blank" rel="noopener">Add it on Open Food Facts ↗</a></p>` : ""}</div>`}
    <div class="sec"><h3>Where to buy</h3>${offers}</div>
    ${p.ingredients_text ? `<div class="sec"><h3>Ingredients (as on label)</h3><div class="ing">${esc(p.ingredients_text)}</div></div>` : ""}
    <div class="sec muted">${esc(p.disclaimer)}<br><br>Source: ${p.source.url ? `<a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.name)}</a>` : esc(p.source.name)}. ${esc(p.attribution)}</div>`;
  $(".x", $("#drawer")).onclick = closeDrawer;
  $("#dlg").classList.add("open");
}

(async () => {
  [facets, platforms] = await Promise.all([fetch("/v1/catalog").then(r => r.json()), fetch("/v1/platforms").then(r => r.json())]);
  refresh();
})();
</script>
</body>
</html>
